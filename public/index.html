<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Yatzy</title>
    <link rel="stylesheet" href="/styles.css?v=20260708-dice-picker">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="/">Online Yatzy</a>
        <div class="connection" id="connection">Klar</div>
      </header>

      <main>
        <section class="setup" id="setupView">
          <form class="panel setup-panel" id="createForm">
            <div>
              <p class="eyebrow">Nytt rom</p>
              <h1>Start et Yatzy-bord</h1>
            </div>

            <label class="field">
              <span>Navnet ditt</span>
              <input id="createName" name="name" autocomplete="name" maxlength="28" required>
            </label>

            <fieldset class="mode-picker">
              <legend>Variant</legend>
              <label class="mode-card">
                <input type="radio" name="mode" value="normal" checked>
                <span class="mode-art mode-art-normal" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span>
                </span>
                <span class="mode-copy">
                  <strong>Yatzy</strong>
                  <small>5 terninger</small>
                </span>
              </label>
              <label class="mode-card mode-card-maxi">
                <input type="radio" name="mode" value="maxi">
                <span class="mode-art mode-art-maxi" aria-hidden="true">
                  <span></span><span></span><span></span><span></span><span></span><span></span>
                </span>
                <span class="mode-copy">
                  <strong>Maxi Yatzy</strong>
                  <small>6 terninger</small>
                </span>
                <span class="mode-badge">MAXI</span>
              </label>
            </fieldset>

            <button class="primary action-button" type="submit">Lag rom</button>
          </form>

          <form class="panel setup-panel" id="joinForm">
            <div>
              <p class="eyebrow">Bli med</p>
              <h2>G&aring; inn i et rom</h2>
            </div>

            <label class="field">
              <span>Romkode</span>
              <input id="roomCode" name="code" inputmode="latin-prose" maxlength="5" required>
            </label>

            <label class="field">
              <span>Navnet ditt</span>
              <input id="joinName" name="name" autocomplete="name" maxlength="28" required>
            </label>

            <button class="secondary action-button" type="submit">Bli med</button>
          </form>
        </section>

        <section class="game-layout is-hidden" id="gameView">
          <section class="play-column">
            <div class="panel table-panel">
              <div class="turn-bar">
                <div>
                  <p class="eyebrow" id="turnEyebrow">Venter</p>
                  <h1 id="turnTitle">Lobby</h1>
                </div>
                <div class="lobby-actions">
                  <button class="secondary action-button is-hidden" id="rulesToggle" type="button" aria-expanded="false" aria-controls="rulesPanel">Regler</button>
                  <button class="primary action-button" id="startGame" type="button">Start spill</button>
                </div>
              </div>

              <form class="rules-panel is-hidden" id="rulesPanel">
                <fieldset class="rules-section">
                  <legend>Generelt</legend>
                  <div class="rule-grid">
                    <label class="field rule-number-field">
                      <span>Poenggrense bonus</span>
                      <input id="bonusThresholdInput" type="number" min="0" max="999" step="1" inputmode="numeric">
                    </label>
                    <label class="field rule-number-field">
                      <span>Bonuspoeng</span>
                      <input id="bonusPointsInput" type="number" min="0" max="999" step="1" inputmode="numeric">
                    </label>
                    <label class="field rule-number-field">
                      <span>Yatzy-poeng</span>
                      <input id="yatzyPointsInput" type="number" min="0" max="999" step="1" inputmode="numeric">
                    </label>
                  </div>
                </fieldset>

                <fieldset class="rules-section">
                  <legend>Tvungen</legend>
                  <div class="rule-toggle-grid">
                    <label class="rule-toggle" id="forcedModeOption">
                      <input id="forcedModeToggle" type="checkbox">
                      <span class="toggle-track" aria-hidden="true"></span>
                      <span class="toggle-copy">
                        <strong>Tvungen modus</strong>
                        <small>Ovenfra og ned</small>
                      </span>
                    </label>
                    <label class="rule-toggle" id="forcedYatzyAnywhereOption">
                      <input id="forcedYatzyAnywhereToggle" type="checkbox">
                      <span class="toggle-track" aria-hidden="true"></span>
                      <span class="toggle-copy">
                        <strong>Plasser Yatzy fritt</strong>
                        <small>Utsett feltet du hopper over</small>
                      </span>
                    </label>
                  </div>
                </fieldset>

                <fieldset class="rules-section" id="maxiRulesSection">
                  <legend>Maxi Yatzy</legend>
                  <div class="rule-grid">
                    <label class="field rule-number-field">
                      <span>Full straight</span>
                      <input id="fullStraightPointsInput" type="number" min="0" max="999" step="1" inputmode="numeric">
                    </label>
                  </div>
                </fieldset>

                <div class="rule-actions">
                  <button class="primary small" id="saveRules" type="submit">Lagre regler</button>
                </div>
              </form>

              <div class="dice-zone">
                <div class="dice-table" id="diceTable">
                  <div class="felt-area">
                    <div class="table-label">
                      <span>Kastefelt</span>
                      <span id="activeDiceLabel">0</span>
                    </div>
                    <div class="dice-3d-stage" id="dice3dStage" aria-hidden="true"></div>
                    <div class="dice-row active-dice" id="activeDiceRow"></div>
                  </div>
                  <div class="saved-area">
                    <div class="table-label">
                      <span>Spart</span>
                      <span id="heldDiceLabel">0</span>
                    </div>
                    <div class="dice-row held-dice" id="heldDiceRow"></div>
                  </div>
                </div>
                <div class="roll-box">
                  <button class="primary roll-button" id="rollDice" type="button">Kast</button>
                  <div class="roll-meta" id="rollMeta">0 kast brukt</div>
                </div>
              </div>

              <div class="play-tools">
                <fieldset class="dice-customizer" id="diceCustomizer">
                  <legend>Terninger</legend>
                  <button class="theme-button" type="button" data-dice-theme="default" aria-label="Default terninger" title="Default terninger">
                    <span class="swatch default"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="wooden" aria-label="Treterninger" title="Treterninger">
                    <span class="swatch wooden"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="blueGreenMetal" aria-label="Blå metallterninger" title="Blå metallterninger">
                    <span class="swatch blueGreenMetal"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="rock" aria-label="Steinterninger" title="Steinterninger">
                    <span class="swatch rock"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="smooth" aria-label="Glatte terninger" title="Glatte terninger">
                    <span class="swatch smooth"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="smooth-pip" aria-label="Glatte prikkterninger" title="Glatte prikkterninger">
                    <span class="swatch smooth-pip"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="lavender" aria-label="Lavendel-lilla terninger" title="Lavendel-lilla terninger">
                    <span class="swatch lavender"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="gold" aria-label="Gullterninger" title="Gullterninger">
                    <span class="swatch gold"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="glitter" aria-label="Glitterterninger" title="Glitterterninger">
                    <span class="swatch glitter"></span>
                  </button>
                  <button class="theme-button" type="button" data-dice-theme="yellow" aria-label="Gule terninger" title="Gule terninger">
                    <span class="swatch yellow"></span>
                  </button>
                </fieldset>

                <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Lyd p&aring;" title="Lyd p&aring;">
                  <span aria-hidden="true">&#128266;</span>
                </button>
              </div>
            </div>

          </section>

          <section class="score-wrap panel">
            <div class="score-last-move is-empty" id="scoreLastMove" aria-live="polite"></div>
            <table class="score-table" id="scoreTable"></table>
          </section>

          <aside class="panel room-flow-panel">
            <section class="compact-section chat-section">
              <h3>Chat</h3>
              <div class="chat-list" id="chatList" aria-live="polite"></div>
              <form class="chat-form" id="chatForm">
                <input id="chatInput" name="message" autocomplete="off" maxlength="160" placeholder="Skriv noe...">
                <button class="primary small" id="sendChat" type="submit">Send</button>
              </form>
            </section>

            <div class="room-strip">
              <div class="room-summary">
                <p class="eyebrow">Rom</p>
                <div class="room-title-row">
                  <h2 id="roomTitle">Yatzy</h2>
                  <div class="status-pill" id="gameStatus">Lobby</div>
                </div>
              </div>
              <section class="compact-section players-section">
                <h3>Spillere</h3>
                <div class="players-list" id="playersList"></div>
              </section>
              <div class="room-actions">
                <button class="code-button" id="copyLink" type="button">
                  <span id="roomCodeLabel">-----</span>
                  <span>Kopier link</span>
                </button>
                <button class="secondary small" id="leaveRoom" type="button">G&aring; ut</button>
              </div>
            </div>

            <div class="room-flow-grid">
              <section class="compact-section flow-section">
                <h3>Flyt</h3>
                <ol class="game-log" id="gameLog"></ol>
              </section>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=20260708-dice-tray" defer></script>
  </body>
</html>
